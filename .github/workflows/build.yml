name: Build JAR
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q karaoke_nct_s40.zip -d work
          echo "PROJ=$(dirname "$(find work -name MANIFEST.MF | head -1)")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download CLDC/MIDP/MMAPI libs + ProGuard
        working-directory: ${{ env.PROJ }}
        run: |
          mkdir -p libs
          M=https://repo1.maven.org/maven2
          V=2.0.4
          curl -fL -o libs/cldcapi10.jar $M/org/microemu/cldcapi10/$V/cldcapi10-$V.jar
          curl -fL -o libs/midpapi20.jar $M/org/microemu/midpapi20/$V/midpapi20-$V.jar
          curl -fL -o libs/mmapi.jar $M/org/microemu/microemu-jsr-135/$V/microemu-jsr-135-$V.jar
          curl -fL -o libs/proguard.jar $M/net/sf/proguard/proguard-base/6.2.2/proguard-base-6.2.2.jar

      - name: Compile
        working-directory: ${{ env.PROJ }}
        run: |
          LIBS=libs/cldcapi10.jar:libs/midpapi20.jar:libs/mmapi.jar
          mkdir -p tmp/classes tmp/pre out
          javac -source 1.3 -target 1.1 -bootclasspath "$LIBS" -d tmp/classes \
            src/Api.java src/Lrc.java src/Net.java src/KaraokeCanvas.java src/KaraokeMidlet.java

      - name: Preverify (ProGuard microedition)
        working-directory: ${{ env.PROJ }}
        run: |
          cat > pg.cfg <<'EOF'
          -injars tmp/classes
          -outjars tmp/pre.jar
          -libraryjars libs/cldcapi10.jar
          -libraryjars libs/midpapi20.jar
          -libraryjars libs/mmapi.jar
          -microedition
          -dontobfuscate
          -dontoptimize
          -dontshrink
          -dontwarn
          -keep public class KaraokeMidlet
          EOF
          java -cp libs/proguard.jar proguard.ProGuard @pg.cfg
          mkdir -p tmp/final && cd tmp/final && unzip -q ../pre.jar

      - name: Package JAR
        working-directory: ${{ env.PROJ }}
        run: |
          jar cfm out/KaraokeNCT.jar MANIFEST.MF -C tmp/final .
          ls -l out/KaraokeNCT.jar
          unzip -l out/KaraokeNCT.jar

      - uses: actions/upload-artifact@v4
        with:
          name: KaraokeNCT-jar
          path: ${{ env.PROJ }}/out/KaraokeNCT.jar
